<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Soft background blob -->
  <ellipse cx="400" cy="270" rx="330" ry="220" fill="#0284c7" fill-opacity="0.08">
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1;1.03;1" dur="4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>

  <!-- Floating background particles -->
  <g fill="#0284c7">
    <circle cx="120" cy="120" r="5" opacity="0.5">
      <animate attributeName="cy" values="120;100;120" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="150" r="4" opacity="0.4">
      <animate attributeName="cy" values="150;130;150" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="380" r="6" opacity="0.4">
      <animate attributeName="cy" values="380;360;380" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="360" r="4" opacity="0.5">
      <animate attributeName="cy" values="360;340;360" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Rotating gear -->
  <g transform="translate(645,120)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      <circle r="16" fill="none" stroke="#0ea5e9" stroke-width="6"/>
      <g stroke="#0ea5e9" stroke-width="6">
        <line x1="0" y1="-22" x2="0" y2="-14"/>
        <line x1="0" y1="22" x2="0" y2="14"/>
        <line x1="-22" y1="0" x2="-14" y2="0"/>
        <line x1="22" y1="0" x2="14" y2="0"/>
      </g>
    </g>
  </g>

  <!-- Twinkling star -->
  <g transform="translate(150,150)">
    <path d="M0,-14 L4,-4 L14,-4 L6,3 L9,13 L0,7 L-9,13 L-6,3 L-14,-4 L-4,-4 Z" fill="#f59e0b">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Floating code tag -->
  <text x="600" y="260" font-family="Courier New, monospace" font-weight="700" font-size="26" fill="#0284c7">
    &lt;/&gt;
    <animate attributeName="y" values="260;245;260" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" repeatCount="indefinite"/>
  </text>

  <!-- Coffee cup with steam -->
  <g transform="translate(155,300)">
    <path d="M-4,-30 C-8,-38 -2,-40 -4,-48" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M6,-30 C2,-38 8,-40 6,-48" stroke="#94a3b8" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M-14,-24 h28 v20 a14,14 0 0 1 -28,0 Z" fill="#0f172a"/>
    <path d="M14,-18 q12,0 12,10 q0,10 -12,10" fill="none" stroke="#0f172a" stroke-width="4"/>
    <rect x="-16" y="-2" width="32" height="6" rx="2" fill="#1e293b"/>
  </g>

  <!-- Desk -->
  <rect x="160" y="368" width="480" height="16" rx="8" fill="#1e293b"/>

  <!-- Bobbing group: laptop + character -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="3s" repeatCount="indefinite"/>

    <!-- Laptop base -->
    <path d="M330,368 L470,368 L486,352 L314,352 Z" fill="#334155"/>

    <!-- Laptop screen -->
    <rect x="322" y="230" width="156" height="122" rx="8" fill="#0f172a"/>
    <rect x="332" y="240" width="136" height="102" rx="4" fill="#0ea5e9" fill-opacity="0.12"/>

    <!-- Typing code lines on screen -->
    <g fill="#38bdf8">
      <rect x="342" y="252" height="6" rx="3" width="0">
        <animate attributeName="width" values="0;70;70;0" keyTimes="0;0.3;0.7;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="342" y="266" height="6" rx="3" width="0">
        <animate attributeName="width" values="0;50;50;0" keyTimes="0;0.3;0.7;1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="342" y="280" height="6" rx="3" width="0">
        <animate attributeName="width" values="0;90;90;0" keyTimes="0;0.3;0.7;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="342" y="294" height="6" rx="3" width="0">
        <animate attributeName="width" values="0;40;40;0" keyTimes="0;0.3;0.7;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="342" y="308" height="6" rx="3" width="0">
        <animate attributeName="width" values="0;65;65;0" keyTimes="0;0.3;0.7;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Character body / hoodie -->
    <path d="M340,352 C340,300 460,300 460,352 L460,368 L340,368 Z" fill="#0284c7"/>
    <path d="M355,320 Q400,295 445,320 L440,300 Q400,282 360,300 Z" fill="#026a9e"/>

    <!-- Arms -->
    <g fill="#0284c7">
      <path d="M345,340 Q315,345 320,365" stroke="#0284c7" stroke-width="14" fill="none" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 345 340;-4 345 340;0 345 340" dur="0.5s" repeatCount="indefinite"/>
      </path>
      <path d="M455,340 Q485,345 480,365" stroke="#0284c7" stroke-width="14" fill="none" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 455 340;4 455 340;0 455 340" dur="0.5s" begin="0.25s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- Hands -->
    <circle cx="320" cy="366" r="9" fill="#f5c396">
      <animate attributeName="cy" values="366;362;366" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="366" r="9" fill="#f5c396">
      <animate attributeName="cy" values="366;362;366" dur="0.5s" begin="0.25s" repeatCount="indefinite"/>
    </circle>

    <!-- Head -->
    <circle cx="400" cy="255" r="52" fill="#f5c396"/>
    <!-- Hair -->
    <path d="M350,240 Q355,195 400,195 Q445,195 450,240 Q430,220 400,222 Q370,220 350,240 Z" fill="#1e293b"/>
    <!-- Ears -->
    <circle cx="349" cy="258" r="8" fill="#f5c396"/>
    <circle cx="451" cy="258" r="8" fill="#f5c396"/>

    <!-- Eyes (blink) -->
    <g fill="#1e293b">
      <ellipse cx="384" cy="254" rx="6" ry="8">
        <animate attributeName="ry" values="8;8;1;8;8" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="416" cy="254" rx="6" ry="8">
        <animate attributeName="ry" values="8;8;1;8;8" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Smile -->
    <path d="M384,278 Q400,290 416,278" stroke="#1e293b" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Cheeks -->
    <circle cx="368" cy="270" r="7" fill="#f59e0b" fill-opacity="0.25"/>
    <circle cx="432" cy="270" r="7" fill="#f59e0b" fill-opacity="0.25"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="400" cy="392" rx="140" ry="10" fill="#0284c7" fill-opacity="0.1">
    <animate attributeName="rx" values="140;150;140" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
