<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6" />
    </linearGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0B1329" />
    </linearGradient>

    <linearGradient id="screenBezel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Character Hood / Jacket Gradient -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <!-- Neon Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* CSS Animations for GitHub SVG support */
    @keyframes cursorBlink {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes typingLeft {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(-1deg); }
      50% { transform: translateY(1px) rotate(1deg); }
      75% { transform: translateY(-2px) rotate(0deg); }
    }

    @keyframes typingRight {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(1px) rotate(1deg); }
      50% { transform: translateY(-3px) rotate(-1deg); }
      75% { transform: translateY(2px) rotate(0.5deg); }
    }

    @keyframes headBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-1.5px); }
    }

    @keyframes codeScroll {
      0% { opacity: 0.3; transform: translateY(2px); }
      50% { opacity: 1; transform: translateY(0px); }
      100% { opacity: 0.3; transform: translateY(-2px); }
    }

    @keyframes boltSpark {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.18); filter: drop-shadow(0 0 8px #FACC15); }
    }

    @keyframes pulseCodeBadge {
      0%, 100% { opacity: 0.9; stroke: #38BDF8; }
      50% { opacity: 1; stroke: #A855F7; filter: drop-shadow(0 0 6px #38BDF8); }
    }

    @keyframes ambientFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes liveDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes codeLineType1 {
      0%, 15% { width: 0; }
      30%, 100% { width: 140px; }
    }

    @keyframes codeLineType2 {
      0%, 35% { width: 0; }
      55%, 100% { width: 190px; }
    }

    @keyframes codeLineType3 {
      0%, 60% { width: 0; }
      80%, 100% { width: 120px; }
    }

    .cursor { animation: cursorBlink 0.9s infinite ease-in-out; }
    .hand-left { animation: typingLeft 0.7s infinite ease-in-out; transform-origin: 320px 290px; }
    .hand-right { animation: typingRight 0.65s infinite ease-in-out; transform-origin: 390px 290px; }
    .character-head { animation: headBob 2.8s infinite ease-in-out; transform-origin: 350px 180px; }
    .spark-bolt { animation: boltSpark 1.8s infinite ease-in-out; transform-origin: 430px 135px; }
    .code-badge { animation: pulseCodeBadge 2.4s infinite ease-in-out; }
    .ambient { animation: ambientFloat 4s infinite ease-in-out; }
    .live-indicator { animation: liveDot 1.4s infinite ease-in-out; }
    .syntax-flow { animation: codeScroll 3s infinite ease-in-out; }

    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .mono {
      font-family: "Fira Code", "Courier New", Consolas, Monaco, monospace;
    }
  </style>

  <!-- Card Frame -->
  <rect x="10" y="10" width="820" height="380" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="0.75">
    <line x1="10" y1="70" x2="830" y2="70" />
    <line x1="10" y1="130" x2="830" y2="130" />
    <line x1="10" y1="190" x2="830" y2="190" />
    <line x1="10" y1="250" x2="830" y2="250" />
    <line x1="10" y1="310" x2="830" y2="310" />
    <line x1="150" y1="10" x2="150" y2="390" />
    <line x1="300" y1="10" x2="300" y2="390" />
    <line x1="450" y1="10" x2="450" y2="390" />
    <line x1="600" y1="10" x2="600" y2="390" />
    <line x1="750" y1="10" x2="750" y2="390" />
  </g>

  <!-- Window Header Bar -->
  <rect x="10" y="10" width="820" height="42" rx="16" fill="#0B1120" />
  <rect x="10" y="36" width="820" height="16" fill="#0B1120" />
  <line x1="10" y1="52" x2="830" y2="52" stroke="#1E293B" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="34" cy="31" r="5.5" fill="#EF4444" />
  <circle cx="52" cy="31" r="5.5" fill="#F59E0B" />
  <circle cx="70" cy="31" r="5.5" fill="#10B981" />

  <!-- Window Title -->
  <text x="420" y="35" text-anchor="middle" fill="#94A3B8" font-size="12.5" font-weight="500" class="mono" letter-spacing="0.5">
    ruditha@developer-station: ~/workspace/portfolio.dart
  </text>

  <!-- Live Status Badge on Right -->
  <g transform="translate(730, 23)">
    <circle cx="0" cy="8" r="4" fill="#10B981" class="live-indicator" />
    <text x="10" y="12" fill="#10B981" font-size="11" font-weight="600" class="mono">ACTIVE</text>
  </g>

  <!-- ==================== LEFT / CENTER: DEVELOPER CHARACTER SETUP ==================== -->
  
  <!-- Desk Base & Legs -->
  <path d="M 80 340 L 450 340 L 435 352 L 95 352 Z" fill="#1E293B" opacity="0.8" />
  <rect x="110" y="348" width="6" height="28" rx="2" fill="#0F172A" />
  <rect x="420" y="348" width="6" height="28" rx="2" fill="#0F172A" />

  <!-- Chair Backrest & Headrest -->
  <rect x="330" y="170" width="48" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <rect x="340" y="142" width="28" height="22" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
  <rect x="351" y="260" width="6" height="40" fill="#334155" />

  <!-- Developer Character -->
  <g>
    <!-- Torso / Hoodie -->
    <path d="M 315 255 C 315 235, 335 220, 355 220 C 375 220, 395 235, 395 255 L 400 305 L 310 305 Z" fill="url(#hoodieGrad)" />
    <!-- Hoodie Strings / Collar Detail -->
    <path d="M 347 222 L 345 248" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 363 222 L 365 248" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Animated Head & Face -->
    <g class="character-head">
      <!-- Neck -->
      <rect x="348" y="206" width="14" height="18" rx="2" fill="#FBCFE8" />
      <!-- Head -->
      <circle cx="355" cy="186" r="22" fill="#FCE7F3" />
      <!-- Stylish Hair -->
      <path d="M 333 186 C 333 165, 348 156, 366 158 C 378 160, 381 170, 380 180 C 373 176, 366 177, 360 178 C 352 179, 343 184, 333 186 Z" fill="#1E1B4B" />
      <!-- Face profile / glasses with cyan reflection -->
      <rect x="354" y="179" width="13" height="8" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.5" />
      <line x1="367" y1="183" x2="373" y2="182" stroke="#38BDF8" stroke-width="1" />
      <!-- Gentle screen glow reflection on cheek -->
      <ellipse cx="363" cy="192" rx="4" ry="2" fill="#38BDF8" opacity="0.2" />
      
      <!-- Headphones with glowing pulse -->
      <rect x="330" y="176" width="6" height="16" rx="3" fill="#6366F1" filter="url(#glow)" />
      <path d="M 332 176 C 332 160, 345 155, 358 155" fill="none" stroke="#6366F1" stroke-width="2" />
    </g>

    <!-- Typing Arms / Hands (Animated) -->
    <!-- Left Arm & Hand -->
    <g class="hand-left">
      <path d="M 322 250 Q 308 275 328 290" fill="none" stroke="#4338CA" stroke-width="10" stroke-linecap="round" />
      <circle cx="330" cy="292" r="5" fill="#FCE7F3" />
    </g>
    <!-- Right Arm & Hand -->
    <g class="hand-right">
      <path d="M 388 250 Q 400 275 378 290" fill="none" stroke="#3730A3" stroke-width="10" stroke-linecap="round" />
      <circle cx="376" cy="292" r="5" fill="#FCE7F3" />
    </g>
  </g>

  <!-- Modern Desk Tabletop -->
  <polygon points="90,298 440,298 465,316 65,316" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <line x1="70" y1="316" x2="460" y2="316" stroke="#475569" stroke-width="1.5" />

  <!-- Laptop Setup -->
  <g transform="translate(195, 205)">
    <!-- Screen Back & Bezel -->
    <polygon points="65,22 175,22 165,92 55,92" fill="url(#screenBezel)" stroke="#38BDF8" stroke-width="1.2" />
    <!-- Screen Display Area with Ambient Code Flow -->
    <polygon points="70,26 170,26 161,88 61,88" fill="url(#screenGrad)" />

    <!-- Mini Code lines on laptop screen -->
    <g transform="translate(72, 34)" opacity="0.9">
      <line x1="0" y1="0" x2="45" y2="0" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" />
      <line x1="0" y1="8" x2="65" y2="8" stroke="#A855F7" stroke-width="2.2" stroke-linecap="round" class="syntax-flow" />
      <line x1="6" y1="16" x2="55" y2="16" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="24" x2="75" y2="24" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="32" x2="35" y2="32" stroke="#818CF8" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="40" x2="50" y2="40" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
      <!-- Mini cursor on laptop screen -->
      <line x1="54" y1="40" x2="59" y2="40" stroke="#F43F5E" stroke-width="2.5" class="cursor" />
    </g>

    <!-- Laptop Keyboard Base -->
    <polygon points="45,92 175,92 195,103 25,103" fill="#334155" stroke="#475569" stroke-width="1" />
    <polygon points="58,94 162,94 174,101 46,101" fill="#0F172A" />
    <!-- Glowing Trackpad -->
    <polygon points="98,99 122,99 125,102 95,102" fill="#1E293B" stroke="#38BDF8" stroke-width="0.6" />
  </g>

  <!-- Glowing CODE Badge Container on Developer's Deck -->
  <g transform="translate(180, 120)">
    <rect x="0" y="0" width="80" height="26" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" class="code-badge" />
    <text x="40" y="17" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="700" class="mono" letter-spacing="2">CODE</text>
  </g>

  <!-- Pulsing Lightning Bolt (Energy of Coding & Focus) -->
  <g class="spark-bolt" transform="translate(268, 118)">
    <polygon points="12,0 3,14 10,14 6,24 19,10 12,10" fill="#FACC15" filter="url(#glow)" />
  </g>

  <!-- Mug of Coffee on the Desk -->
  <g transform="translate(140, 290)">
    <rect x="0" y="0" width="14" height="18" rx="2" fill="#0284C7" stroke="#38BDF8" stroke-width="1" />
    <path d="M 14 4 C 18 4, 18 12, 14 12" fill="none" stroke="#38BDF8" stroke-width="1.5" />
    <!-- Steam -->
    <path d="M 4 -3 Q 6 -7 4 -11" fill="none" stroke="#94A3B8" stroke-width="1" opacity="0.6" class="syntax-flow" />
    <path d="M 9 -2 Q 11 -6 9 -10" fill="none" stroke="#94A3B8" stroke-width="1" opacity="0.4" class="syntax-flow" />
  </g>

  <!-- ==================== RIGHT SIDE: LIVE INTERACTIVE CODE DISPLAY ==================== -->
  
  <g transform="translate(450, 72)">
    <!-- Terminal Window Container -->
    <rect x="0" y="0" width="360" height="288" rx="10" fill="#030712" stroke="#1E293B" stroke-width="1.5" />

    <!-- Sub-header -->
    <rect x="0" y="0" width="360" height="28" rx="10" fill="#0F172A" />
    <rect x="0" y="18" width="360" height="10" fill="#0F172A" />
    <line x1="0" y1="28" x2="360" y2="28" stroke="#1E293B" stroke-width="1" />

    <text x="14" y="19" fill="#64748B" font-size="11" class="mono">~/profile/ruditha.config.json</text>
    <rect x="290" y="6" width="56" height="16" rx="4" fill="#1E293B" />
    <text x="318" y="18" text-anchor="middle" fill="#38BDF8" font-size="9.5" font-weight="600" class="mono">LIVE</text>

    <!-- Code Editor Content -->
    <g transform="translate(18, 48)" class="mono" font-size="12" letter-spacing="0.2">
      <!-- Line Numbers -->
      <g fill="#334155" text-anchor="end" font-size="11">
        <text x="10" y="0">01</text>
        <text x="10" y="22">02</text>
        <text x="10" y="44">03</text>
        <text x="10" y="66">04</text>
        <text x="10" y="88">05</text>
        <text x="10" y="110">06</text>
        <text x="10" y="132">07</text>
        <text x="10" y="154">08</text>
        <text x="10" y="176">09</text>
        <text x="10" y="198">10</text>
        <text x="10" y="220">11</text>
      </g>

      <!-- Code Text with Syntax Highlighting -->
      <g transform="translate(26, 0)">
        <!-- Line 1 -->
        <text y="0">
          <tspan fill="#F43F5E" font-weight="600">const</tspan>
          <tspan fill="#E2E8F0"> developer</tspan>
          <tspan fill="#38BDF8"> = </tspan>
          <tspan fill="#CBD5E1">{</tspan>
        </text>

        <!-- Line 2 -->
        <text y="22">
          <tspan fill="#94A3B8">  name: </tspan>
          <tspan fill="#34D399">"Ruditha Yukthika"</tspan>
          <tspan fill="#CBD5E1">,</tspan>
        </text>

        <!-- Line 3 -->
        <text y="44">
          <tspan fill="#94A3B8">  role: </tspan>
          <tspan fill="#34D399">"Developer &amp; Designer"</tspan>
          <tspan fill="#CBD5E1">,</tspan>
        </text>

        <!-- Line 4 -->
        <text y="66">
          <tspan fill="#94A3B8">  focus: </tspan>
          <tspan fill="#CBD5E1">[</tspan>
          <tspan fill="#FBBF24">"Flutter"</tspan>
          <tspan fill="#CBD5E1">, </tspan>
          <tspan fill="#FBBF24">"Python"</tspan>
          <tspan fill="#CBD5E1">],</tspan>
        </text>

        <!-- Line 5 -->
        <text y="88">
          <tspan fill="#94A3B8">  craft: </tspan>
          <tspan fill="#CBD5E1">[</tspan>
          <tspan fill="#FBBF24">"UI/UX"</tspan>
          <tspan fill="#CBD5E1">, </tspan>
          <tspan fill="#FBBF24">"Backend"</tspan>
          <tspan fill="#CBD5E1">],</tspan>
        </text>

        <!-- Line 6 -->
        <text y="110">
          <tspan fill="#94A3B8">  motto: </tspan>
          <tspan fill="#C084FC">"Code • Create • Improve"</tspan>
        </text>

        <!-- Line 7 -->
        <text y="132">
          <tspan fill="#CBD5E1">};</tspan>
        </text>

        <!-- Line 8 -->
        <text y="154">
          <tspan fill="#64748B">// Continuous iteration cycle</tspan>
        </text>

        <!-- Line 9 -->
        <text y="176">
          <tspan fill="#F43F5E" font-weight="600">while</tspan>
          <tspan fill="#CBD5E1"> (learning) </tspan>
          <tspan fill="#CBD5E1">{</tspan>
        </text>

        <!-- Line 10 -->
        <text y="198">
          <tspan fill="#818CF8">  developer</tspan>
          <tspan fill="#38BDF8">.</tspan>
          <tspan fill="#38BDF8">code</tspan>
          <tspan fill="#CBD5E1">().</tspan>
          <tspan fill="#38BDF8">improve</tspan>
          <tspan fill="#CBD5E1">();</tspan>
        </text>

        <!-- Line 11 -->
        <text y="220">
          <tspan fill="#CBD5E1">}</tspan>
          <tspan fill="#38BDF8" class="cursor" font-weight="bold"> █</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Ambient Floating Tech Elements -->
  <g class="ambient" opacity="0.6">
    <circle cx="85" cy="110" r="3" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="430" cy="90" r="2.5" fill="#A855F7" filter="url(#glow)" />
    <circle cx="460" cy="370" r="2" fill="#34D399" />
    <circle cx="790" cy="365" r="2.5" fill="#38BDF8" />
  </g>
</svg>
