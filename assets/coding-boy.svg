<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="Animated developer coding at a laptop" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#141a2e"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2140"/>
      <stop offset="100%" stop-color="#241b40"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Courier New', Consolas, monospace; }
      .bolt {
        transform-origin: 560px 60px;
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      .armL {
        transform-origin: 235px 178px;
        animation: type-left 0.6s ease-in-out infinite;
      }
      .armR {
        transform-origin: 285px 178px;
        animation: type-right 0.6s ease-in-out infinite;
      }
      @keyframes type-left {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-6deg); }
      }
      @keyframes type-right {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(6deg); }
      }
      .head {
        transform-origin: 260px 120px;
        animation: nod 3.2s ease-in-out infinite;
      }
      @keyframes nod {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      .code-line { animation: flicker 4s linear infinite; }
      .code-line.l2 { animation-delay: .2s; }
      .code-line.l3 { animation-delay: .4s; }
      .code-line.l4 { animation-delay: .6s; }
      @keyframes flicker {
        0%, 6%   { opacity: 0.25; }
        8%, 45%  { opacity: 1; }
        50%, 100%{ opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="640" height="260" rx="16" fill="url(#bg)"/>

  <!-- Laptop screen -->
  <rect x="150" y="40" width="220" height="140" rx="10" fill="url(#screenGrad)" stroke="#3a3f63" stroke-width="2"/>
  <rect x="163" y="53" width="194" height="114" rx="4" fill="#0d1117"/>

  <!-- Code lines -->
  <text x="172" y="72" class="mono code-line l1" font-size="11" fill="#58a6ff">const CODE = {</text>
  <text x="180" y="88" class="mono code-line l2" font-size="11" fill="#a371f7">build: true,</text>
  <text x="180" y="104" class="mono code-line l3" font-size="11" fill="#7ee787">design: "clean",</text>
  <text x="172" y="120" class="mono code-line l4" font-size="11" fill="#58a6ff">};</text>
  <text x="172" y="140" class="mono" font-size="11" fill="#e6edf3">run(CODE)<tspan id="cursor" fill="#a371f7">▌</tspan></text>
  <animate xlink:href="#cursor" attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/>

  <!-- Laptop base -->
  <path d="M130 180 L390 180 L410 200 L110 200 Z" fill="#1c2333" stroke="#3a3f63" stroke-width="2"/>

  <!-- Developer character -->
  <g class="head">
    <circle cx="260" cy="118" r="26" fill="#f2c9a0"/>
    <path d="M234 108 a26 26 0 0 1 52 0 v-6 a26 22 0 0 0 -52 0 z" fill="#2b2140"/>
  </g>
  <rect x="238" y="150" width="44" height="34" rx="10" fill="url(#accent)"/>

  <!-- Arms typing -->
  <rect class="armL" x="225" y="172" width="24" height="8" rx="4" fill="#f2c9a0"/>
  <rect class="armR" x="271" y="172" width="24" height="8" rx="4" fill="#f2c9a0"/>

  <!-- Chair -->
  <rect x="248" y="184" width="24" height="16" fill="#3a3f63"/>

  <!-- Lightning bolt accent -->
  <polygon class="bolt" points="560,40 548,64 558,64 552,84 572,56 560,56" fill="#e3b341"/>

  <!-- Rocket accent -->
  <g transform="translate(60,190)">
    <path d="M0 20 L10 0 L20 20 Z" fill="url(#accent)"/>
    <circle cx="10" cy="14" r="3" fill="#0d1117"/>
  </g>

  <!-- subtitle -->
  <text x="320" y="235" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">Developer • Designer • Learner</text>
</svg>
