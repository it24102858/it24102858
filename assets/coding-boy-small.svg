<svg width="320" height="220" viewBox="0 0 320 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Soft background blob -->
  <ellipse cx="160" cy="118" rx="140" ry="95" fill="#0284c7" fill-opacity="0.08">
    <animateTransform attributeName="transform" type="scale" additive="sum"
      values="1;1.03;1" dur="4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>

  <!-- Floating particles -->
  <g fill="#0284c7">
    <circle cx="48" cy="48" r="3" opacity="0.5">
      <animate attributeName="cy" values="48;38;48" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="272" cy="60" r="2.5" opacity="0.4">
      <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="258" cy="165" r="3" opacity="0.4">
      <animate attributeName="cy" values="165;155;165" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Rotating gear -->
  <g transform="translate(258,52)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="6s" repeatCount="indefinite"/>
      <circle r="8" fill="none" stroke="#0ea5e9" stroke-width="3"/>
      <g stroke="#0ea5e9" stroke-width="3">
        <line x1="0" y1="-11" x2="0" y2="-7"/>
        <line x1="0" y1="11" x2="0" y2="7"/>
        <line x1="-11" y1="0" x2="-7" y2="0"/>
        <line x1="11" y1="0" x2="7" y2="0"/>
      </g>
    </g>
  </g>

  <!-- Twinkling star -->
  <g transform="translate(60,60)">
    <path d="M0,-7 L2,-2 L7,-2 L3,1.5 L4.5,6.5 L0,3.5 L-4.5,6.5 L-3,1.5 L-7,-2 L-2,-2 Z" fill="#f59e0b">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Floating code tag -->
  <text x="240" y="112" font-family="Courier New, monospace" font-weight="700" font-size="13" fill="#0284c7">
    &lt;/&gt;
    <animate attributeName="y" values="112;104;112" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" repeatCount="indefinite"/>
  </text>

  <!-- Desk -->
  <rect x="64" y="162" width="192" height="7" rx="3.5" fill="#1e293b"/>

  <!-- Bobbing group: laptop + character -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="3s" repeatCount="indefinite"/>

    <!-- Laptop base -->
    <path d="M132,162 L188,162 L194,155 L126,155 Z" fill="#334155"/>

    <!-- Laptop screen -->
    <rect x="129" y="112" width="62" height="49" rx="3" fill="#0f172a"/>
    <rect x="133" y="116" width="54" height="41" rx="2" fill="#0ea5e9" fill-opacity="0.12"/>

    <!-- Typing code lines -->
    <g fill="#38bdf8">
      <rect x="137" y="121" height="2.5" rx="1.2" width="0">
        <animate attributeName="width" values="0;28;28;0" keyTimes="0;0.3;0.7;1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="137" y="127" height="2.5" rx="1.2" width="0">
        <animate attributeName="width" values="0;20;20;0" keyTimes="0;0.3;0.7;1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="137" y="133" height="2.5" rx="1.2" width="0">
        <animate attributeName="width" values="0;36;36;0" keyTimes="0;0.3;0.7;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="137" y="139" height="2.5" rx="1.2" width="0">
        <animate attributeName="width" values="0;16;16;0" keyTimes="0;0.3;0.7;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="137" y="145" height="2.5" rx="1.2" width="0">
        <animate attributeName="width" values="0;26;26;0" keyTimes="0;0.3;0.7;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Character body / hoodie -->
    <path d="M136,155 C136,132 184,132 184,155 L184,162 L136,162 Z" fill="#0284c7"/>
    <path d="M142,140 Q160,129 178,140 L176,131 Q160,124 144,131 Z" fill="#026a9e"/>

    <!-- Arms -->
    <path d="M138,148 Q126,150 128,159" stroke="#0284c7" stroke-width="6" fill="none" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 138 148;-4 138 148;0 138 148" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M182,148 Q194,150 192,159" stroke="#0284c7" stroke-width="6" fill="none" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 182 148;4 182 148;0 182 148" dur="0.5s" begin="0.25s" repeatCount="indefinite"/>
    </path>
    <!-- Hands -->
    <circle cx="128" cy="160" r="3.8" fill="#f5c396">
      <animate attributeName="cy" values="160;158;160" dur="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="192" cy="160" r="3.8" fill="#f5c396">
      <animate attributeName="cy" values="160;158;160" dur="0.5s" begin="0.25s" repeatCount="indefinite"/>
    </circle>

    <!-- Head -->
    <circle cx="160" cy="112" r="22" fill="#f5c396"/>
    <!-- Hair -->
    <path d="M141,105 Q143,84 160,84 Q177,84 179,105 Q170,97 160,98 Q150,97 141,105 Z" fill="#1e293b"/>

    <!-- Eyes (blink) -->
    <g fill="#1e293b">
      <ellipse cx="153" cy="110" rx="2.5" ry="3.4">
        <animate attributeName="ry" values="3.4;3.4;0.5;3.4;3.4" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="167" cy="110" rx="2.5" ry="3.4">
        <animate attributeName="ry" values="3.4;3.4;0.5;3.4;3.4" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Smile -->
    <path d="M153,120 Q160,125 167,120" stroke="#1e293b" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Cheeks -->
    <circle cx="147" cy="116" r="3" fill="#f59e0b" fill-opacity="0.25"/>
    <circle cx="173" cy="116" r="3" fill="#f59e0b" fill-opacity="0.25"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="160" cy="173" rx="58" ry="4" fill="#0284c7" fill-opacity="0.1">
    <animate attributeName="rx" values="58;62;58" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
