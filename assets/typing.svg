<svg width="500" height="40" viewBox="0 0 400 40" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .typing-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 20px;
      font-weight: 700;
      fill: #0284c7;
    }
  </style>

  <defs>
    <!-- Phrase 1: "Developer • Designer • Learner" -->
    <clipPath id="clip1">
      <rect x="0" y="0" height="40">
        <animate id="clip1anim" attributeName="width"
          values="0;365;365;0" keyTimes="0;0.3;0.8;1"
          dur="4s" begin="0s;clip3anim.end" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- Phrase 2: "Code • Create • Improve" -->
    <clipPath id="clip2">
      <rect x="0" y="0" height="40">
        <animate id="clip2anim" attributeName="width"
          values="0;281;281;0" keyTimes="0;0.3;0.8;1"
          dur="4s" begin="clip1anim.end" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- Phrase 3: "Flutter • Python • JavaScript" -->
    <clipPath id="clip3">
      <rect x="0" y="0" height="40">
        <animate id="clip3anim" attributeName="width"
          values="0;353;353;0" keyTimes="0;0.3;0.8;1"
          dur="4s" begin="clip2anim.end" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- textLength + lengthAdjust force each phrase to render at an exact,
       known pixel width, so the clip-path above always matches the real
       text width and never crops the last character(s). -->
  <text x="10" y="27" class="typing-text" clip-path="url(#clip1)"
    textLength="360" lengthAdjust="spacingAndGlyphs">Developer • Designer • Learner</text>
  <text x="10" y="27" class="typing-text" clip-path="url(#clip2)"
    textLength="276" lengthAdjust="spacingAndGlyphs">Code • Create • Improve</text>
  <text x="10" y="27" class="typing-text" clip-path="url(#clip3)"
    textLength="348" lengthAdjust="spacingAndGlyphs">Flutter • Python • JavaScript</text>

  <!-- Cursor: tracks the right edge of whichever phrase is being typed/deleted -->
  <rect y="8" width="3" height="24" fill="#0284c7">
    <animate attributeName="x"
      values="10;375;375;10" keyTimes="0;0.3;0.8;1"
      dur="4s" begin="0s;clip3anim.end" fill="freeze"/>
    <animate attributeName="x"
      values="10;291;291;10" keyTimes="0;0.3;0.8;1"
      dur="4s" begin="clip1anim.end" fill="freeze"/>
    <animate attributeName="x"
      values="10;363;363;10" keyTimes="0;0.3;0.8;1"
      dur="4s" begin="clip2anim.end" fill="freeze"/>
    <!-- Blink -->
    <animate attributeName="opacity"
      values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1"
      dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
