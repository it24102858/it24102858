<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 48" width="100%" height="48">
  <style>
    @keyframes cycleText1 {
      0%, 28% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
    @keyframes cycleText2 {
      0%, 31% { opacity: 0; }
      35%, 62% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    @keyframes cycleText3 {
      0%, 65% { opacity: 0; }
      69%, 96% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .line-text {
      font-family: "Fira Code", "Courier New", Consolas, Monaco, monospace;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .text-1 { animation: cycleText1 9s infinite; }
    .text-2 { animation: cycleText2 9s infinite; }
    .text-3 { animation: cycleText3 9s infinite; }
    .cursor { animation: cursorBlink 0.8s infinite; }
  </style>

  <!-- Centered container -->
  <g transform="translate(325, 30)" text-anchor="middle">
    <!-- Frame 1 -->
    <text class="line-text text-1" fill="#38BDF8">
      Developer &bull; Designer &bull; Learner<tspan fill="#A855F7" class="cursor"> _</tspan>
    </text>

    <!-- Frame 2 -->
    <text class="line-text text-2" fill="#818CF8">
      Code &bull; Create &bull; Improve<tspan fill="#38BDF8" class="cursor"> _</tspan>
    </text>

    <!-- Frame 3 -->
    <text class="line-text text-3" fill="#34D399">
      Flutter &bull; Python &bull; JavaScript<tspan fill="#F43F5E" class="cursor"> _</tspan>
    </text>
  </g>
</svg>
